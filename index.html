<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>South America Strategy</title><style>body{margin:0;background:#0c1722;color:#e9f2f7;font:15px system-ui}header{padding:14px 18px;display:flex;justify-content:space-between;background:#122535}h1{font-size:18px;margin:0}small{color:#9db1bd}main{padding:12px}#map{height:70vh;min-height:420px;border-radius:12px;background:#10212d}#info{padding:14px;background:#173044;border-radius:10px;margin-top:10px}.filters{display:flex;gap:12px;align-items:center;padding:10px 2px;font-size:14px}.filters input{accent-color:#38a8e0}button{background:#2c6277;color:white;border:0;border-radius:8px;padding:8px;margin:3px} .leaflet-container{background:#0c2332}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><header><div><h1>South America Strategy</h1><small>Карта — прототип • кампания не запущена</small></div><span>v0.1</span></header><main><div class="filters"><label><input id="potential" type="checkbox"> Потенциальные точки</label></div><div id="map"></div><div id="info">Нажми на город, чтобы увидеть точку потенциального базирования. Пока отображается только демонстрационный набор городов.</div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([-15,-60],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(m);const cities=[['Мараба',-5.3686,-49.1178],['Порту-Велью',-8.7619,-63.9039],['Сальвадор',-12.9777,-38.5016],['Лима',-12.0464,-77.0428],['Ика',-14.0678,-75.7286],['Богота',4.711,-74.0721],['Буэнос-Айрес',-34.6037,-58.3816],['Белу-Оризонти',-19.9167,-43.9345],['Сан-Луис',-2.5297,-44.3028],['Манаус',-3.119,-60.0217],['Аракажу',-10.9472,-37.0731],['Боа-Виста',2.8235,-60.6758]];const potentialLayer=L.layerGroup();cities.forEach(([name,lat,lon])=>L.circleMarker([lat,lon],{radius:6,color:'#a6d8e9',fillColor:'#3b9bb7',fillOpacity:.85}).addTo(potentialLayer).on('click',()=>{document.getElementById('info').textContent=name+' — потенциальная точка базирования. Реальные игровые объекты появятся после подключения проверенного состояния.'}));document.getElementById('potential').addEventListener('change',e=>{if(e.target.checked)potentialLayer.addTo(m);else m.removeLayer(potentialLayer)});</script></html>
