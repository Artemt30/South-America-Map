<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>South America — Постройки</title><style>body{margin:0;background:#101923;color:#eaf0f6;font:15px system-ui}header,main{max-width:1120px;margin:auto;padding:18px}a{color:#82cfff}h1{font-size:24px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{padding:16px;border-radius:12px;background:#1b2b3b;border:1px solid #34495a}.muted{color:#a5bac8;font-size:13px}input,select{background:#22384a;color:#fff;border:1px solid #526779;border-radius:8px;padding:10px;font:inherit;max-width:100%}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.num{font-weight:bold}.tag{display:inline-block;background:#294a60;border-radius:5px;padding:3px 7px;font-size:12px;margin-bottom:8px}</style><header><a href="./">← Вернуться к карте</a><h1>Каталог доступных построек</h1><p class="muted">Данные из согласованного каталога South America Strategy. Строительство одного нового объекта за неделю. Доходы — за игровой ход. Не показаны неутверждённые шаблоны. Это справочник, приказы здесь не отправляются.</p><div class="controls"><input id="q" placeholder="Поиск здания" aria-label="Поиск"><select id="type"><option value="">Все категории</option><option value="economy">Экономика</option><option value="military">Военные</option></select><select id="sort"><option value="cost">Сначала дешёвые</option><option value="time">Сначала быстрые</option><option value="income">По доходу</option></select></div><span id="count"></span></header><main><div id="cards"></div></main><script>const items=[{"id":"oil_facility","name":"Нефтяное предприятие","category":"economy","cost":8000000,"weeks":2,"income":600000,"hp":100},{"id":"solar_farm_20mw","name":"Солнечная ферма 20 МВт","category":"economy","cost":18000000,"weeks":4,"income":150000,"hp":100},{"id":"crab_farm_medium","name":"Крабовая ферма","category":"economy","cost":6000000,"weeks":3,"income":125000,"hp":100},{"id":"cable_factory","name":"Завод медных кабелей","category":"economy","cost":18000000,"weeks":4,"income":400000,"hp":200},{"id":"power_plant_500mw","name":"ТЭС 500 МВт","category":"economy","cost":500000000,"weeks":30,"income":5000000,"hp":1000},{"id":"nuclear_plant_1gw","name":"АЭС 1 ГВт","category":"economy","cost":6000000000,"weeks":84,"income":65000000,"hp":1500},{"id":"military_base","name":"Военная база","category":"military","cost":25000000,"weeks":4,"income":0,"hp":300},{"id":"military_airfield","name":"Военный аэродром","category":"military","cost":45000000,"weeks":5,"income":0,"hp":300},{"id":"military_port","name":"Военный порт","category":"military","cost":65000000,"weeks":6,"income":0,"hp":400},{"id":"ground_vehicle_factory","name":"Завод наземной техники","category":"military","cost":65000000,"weeks":7,"income":0,"hp":400},{"id":"aircraft_factory","name":"Авиастроительный завод","category":"military","cost":90000000,"weeks":9,"income":0,"hp":400},{"id":"shipyard","name":"Судостроительный завод","category":"military","cost":140000000,"weeks":12,"income":0,"hp":500},{"id":"missile_factory_small","name":"Ракетный завод малый","category":"military","cost":30000000,"weeks":4,"income":0,"hp":200},{"id":"missile_factory_medium","name":"Ракетный завод средний","category":"military","cost":60000000,"weeks":6,"income":0,"hp":300},{"id":"missile_factory_large","name":"Ракетный завод крупный","category":"military","cost":110000000,"weeks":9,"income":0,"hp":500},{"id":"iron_castings_medium","name":"Завод чугунных изделий","category":"economy","cost":28000000,"weeks":8,"income":5000000,"hp":300},{"id":"li_ion_cell_factory","name":"Завод аккумуляторных ячеек","category":"economy","cost":150000000,"weeks":18,"income":8333333,"hp":400},{"id":"lithium_mine_processing","name":"Литиевая шахта и переработка","category":"economy","cost":400000000,"weeks":30,"income":17500000,"hp":500},{"id":"industrial_optics_medium_b","name":"Завод промышленной оптики B","category":"economy","cost":35000000,"weeks":10,"income":6250000,"hp":200},{"id":"generic_pharma_medium","name":"Фармацевтический завод дженериков","category":"economy","cost":65000000,"weeks":16,"income":12500000,"hp":300},{"id":"mri_equipment_factory","name":"Завод аппаратов МРТ","category":"economy","cost":180000000,"weeks":24,"income":12500000,"hp":400},{"id":"industrial_optics_large_a","name":"Завод промышленной оптики A","category":"economy","cost":120000000,"weeks":15,"income":2000000,"hp":300},{"id":"industrial_factory_medium","name":"Промышленный завод 10000 тонн","category":"economy","cost":180000000,"weeks":18,"income":20833333,"hp":500},{"id":"refinery_medium","name":"НПЗ средний","category":"economy","cost":2500000000,"weeks":48,"income":16000000,"hp":900},{"id":"steel_mill","name":"Сталелитейный завод","category":"economy","cost":1200000000,"weeks":36,"income":8000000,"hp":700}];const cash=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3}).format(v/1000000)+' млн $';const q=document.getElementById('q'),type=document.getElementById('type'),sort=document.getElementById('sort');function render(){let a=items.filter(x=>(!type.value||x.category===type.value)&&x.name.toLowerCase().includes(q.value.toLowerCase()));a.sort((x,y)=>sort.value==='time'?x.weeks-y.weeks:sort.value==='income'?y.income-x.income:x.cost-y.cost);document.getElementById('count').textContent='Показано: '+a.length;document.getElementById('cards').replaceChildren(...a.map(x=>{let e=document.createElement('article');e.className='card';let d=document.createElement('div');d.className='tag';d.textContent=x.category==='military'?'Военная инфраструктура':'Экономика';let h=document.createElement('h3');h.textContent=x.name;e.append(d,h);for(let [n,v] of [['Стоимость',cash(x.cost)],['Строительство',x.weeks+' нед.'],['Доход за неделю',cash(x.income||0)],['HP',x.hp]]){let p=document.createElement('p');p.innerHTML='<span class="muted">'+n+': </span><span class="num"></span>';p.querySelector('.num').textContent=v;e.append(p)}return e}))}q.oninput=type.onchange=sort.onchange=render;render()</script></html>
