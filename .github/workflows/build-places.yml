name: Build settlement catalogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_top1000.py
      - .github/workflows/build-places.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_top1000.py
      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if ! git diff --cached --quiet; then
            git commit -m "Build South America settlement catalogue"
            git push
          fi
